<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Oazy web app</title>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="bar">
	<div id="mark"></div>
	<div id="name"></div>
	<div id="tabs"></div>
	<div id="drag"></div>
	<div id="chip" role="status"></div>
	<div id="tools">
		<button id="back" class="icon-btn" title="Back (Alt+Left)"></button>
		<button id="reload" class="icon-btn" title="Reload (Ctrl+R)"></button>
		<i class="sep"></i>
		<button id="look" class="icon-btn" title="Oazy look (Ctrl+Shift+O)"></button>
		<button id="browser" class="icon-btn" title="Open this page in Oazy Browser"></button>
	</div>
	<div id="wincontrols">
		<button id="win-min" title="Minimise"></button>
		<button id="win-max" title="Maximise"></button>
		<button id="win-close" title="Close"></button>
	</div>
	<div id="progress"><i></i></div>
</div>

<script src="icons.js"></script>
<script src="app.js"></script>
</body>
</html>
