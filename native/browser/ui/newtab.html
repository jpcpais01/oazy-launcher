<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New tab</title>
<link rel="stylesheet" href="common.css">
<style>
	html, body { background: transparent; overflow: hidden; }

	/* Slow, soft light drifting behind the glass. Two blurred blobs, nothing else. */
	.aura { position: fixed; inset: -20%; pointer-events: none; z-index: -1; }
	.aura i {
		position: absolute;
		width: 52vmax;
		height: 52vmax;
		border-radius: 50%;
		filter: blur(70px);
		opacity: 0.32;
		will-change: transform;
	}
	.aura i:nth-child(1) { left: 8%; top: 4%; background: radial-gradient(circle, rgba(var(--accent-rgb), 0.55), transparent 65%); animation: drift1 38s ease-in-out infinite alternate; }
	.aura i:nth-child(2) { right: 4%; bottom: 0; background: radial-gradient(circle, rgba(70, 120, 255, 0.4), transparent 65%); animation: drift2 46s ease-in-out infinite alternate; }
	@keyframes drift1 { to { transform: translate(14vw, 10vh) scale(1.15); } }
	@keyframes drift2 { to { transform: translate(-12vw, -8vh) scale(0.9); } }
	.shade { position: fixed; inset: 0; z-index: -1; background: radial-gradient(120% 90% at 50% 40%, rgba(3, 10, 14, 0.12), rgba(3, 10, 14, 0.5)); }

	main {
		min-height: 100%;
		display: flex;
		flex-direction: column;
		align-items: center;
		padding: 0 24px;
	}
	.spacer { flex: 1 1 0; max-height: 22vh; min-height: 32px; }

	.clock {
		font-family: "Segoe UI Variable Display", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
		font-size: clamp(56px, 10vh, 96px);
		font-weight: 300;
		letter-spacing: -0.02em;
		line-height: 1;
		font-variant-numeric: tabular-nums;
		text-shadow: 0 2px 30px rgba(0, 0, 0, 0.25);
		animation: rise 0.6s var(--ease) both;
	}
	.greet {
		margin-top: 10px;
		font-size: 15px;
		color: var(--dim);
		animation: rise 0.6s 0.05s var(--ease) both;
	}
	.greet b { color: var(--text); font-weight: 500; }
	@keyframes rise { from { opacity: 0; transform: translateY(10px); } }

	.search {
		margin-top: clamp(24px, 5vh, 44px);
		width: min(640px, 100%);
		height: 56px;
		display: flex;
		align-items: center;
		gap: 12px;
		padding: 0 20px;
		border-radius: 18px;
		background: linear-gradient(180deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.07));
		box-shadow:
			inset 0 1px 0 rgba(255, 255, 255, 0.18),
			inset 0 0 0 1px rgba(255, 255, 255, 0.08),
			0 12px 40px rgba(0, 0, 0, 0.25);
		backdrop-filter: blur(20px) saturate(1.3);
		color: var(--dim);
		cursor: text;
		transition: box-shadow 0.2s, background 0.2s, transform 0.2s var(--ease);
		animation: rise 0.6s 0.1s var(--ease) both;
	}
	.search:hover { background: linear-gradient(180deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.09)); }
	.search:focus-within {
		box-shadow:
			inset 0 1px 0 rgba(255, 255, 255, 0.18),
			inset 0 0 0 1px rgba(var(--accent-rgb), 0.6),
			0 0 0 5px rgba(var(--accent-rgb), 0.12),
			0 12px 40px rgba(0, 0, 0, 0.25);
	}
	.search input { flex: 1; height: 100%; font-size: 16px; color: var(--text); }

	.tiles {
		margin-top: clamp(28px, 6vh, 56px);
		display: grid;
		grid-template-columns: repeat(5, 112px);
		gap: 8px 6px;
		justify-content: center;
		animation: rise 0.6s 0.16s var(--ease) both;
	}
	@media (max-width: 640px) { .tiles { grid-template-columns: repeat(4, 104px); } }
	@media (max-width: 480px) { .tiles { grid-template-columns: repeat(3, 100px); } }
	.tile {
		position: relative;
		height: 112px;
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		gap: 10px;
		border-radius: 16px;
		text-decoration: none;
		color: var(--text);
		transition: background 0.18s, transform 0.25s var(--spring);
	}
	.tile:hover { background: rgba(255, 255, 255, 0.07); transform: translateY(-2px); }
	.tile:active { transform: scale(0.97); }
	.tile .ic-wrap {
		width: 56px;
		height: 56px;
		border-radius: 18px;
		display: grid;
		place-items: center;
		background: linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.08));
		box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), inset 0 0 0 1px rgba(255, 255, 255, 0.07), 0 6px 18px rgba(0, 0, 0, 0.22);
		font-size: 22px;
		font-weight: 600;
		color: #fff;
		overflow: hidden;
	}
	.tile .ic-wrap img { width: 30px; height: 30px; border-radius: 6px; }
	.tile .ic-wrap img.small { width: 22px; height: 22px; border-radius: 4px; }
	.tile .name {
		max-width: 100px;
		font-size: 12.5px;
		color: var(--dim);
		white-space: nowrap;
		overflow: hidden;
		text-overflow: ellipsis;
	}
	.tile:hover .name { color: var(--text); }
	.tile .pinmark { position: absolute; top: 10px; left: 12px; color: var(--accent); opacity: 0.85; }
	.tile .more {
		position: absolute;
		top: 6px;
		right: 6px;
		width: 26px;
		height: 26px;
		border-radius: 8px;
		display: grid;
		place-items: center;
		color: var(--dim);
		opacity: 0;
		transition: opacity 0.12s, background 0.12s;
	}
	.tile:hover .more { opacity: 1; }
	.tile .more:hover { background: rgba(255, 255, 255, 0.12); color: var(--text); }
	.tile.add .ic-wrap { background: rgba(255, 255, 255, 0.05); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12); color: var(--dim); }

	.pop {
		position: fixed;
		z-index: 10;
		min-width: 190px;
		padding: 6px;
		display: none;
	}
	.pop.show { display: block; animation: pop 0.16s var(--ease); }
	@keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(0.98); } }
	.pop .mi { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 8px; color: var(--text); }
	.pop .mi .ic { color: var(--dim); }
	.pop .mi:hover { background: rgba(255, 255, 255, 0.08); }

	.add-form {
		position: fixed;
		z-index: 11;
		left: 50%;
		top: 50%;
		width: 360px;
		margin: -110px 0 0 -180px;
		padding: 18px;
		display: none;
		flex-direction: column;
		gap: 10px;
	}
	.add-form.show { display: flex; animation: pop 0.2s var(--ease); }
	.add-form h3 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
	.field { height: 38px; padding: 0 12px; border-radius: 10px; background: rgba(0, 0, 0, 0.28); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08); font-size: 13.5px; }
	.field:focus { box-shadow: inset 0 0 0 1px rgba(var(--accent-rgb), 0.55); }
	.row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
	.btn { height: 34px; padding: 0 16px; border-radius: 10px; font-size: 13px; background: rgba(255, 255, 255, 0.08); }
	.btn:hover { background: rgba(255, 255, 255, 0.13); }
	.btn.primary { background: var(--accent); color: #04191a; font-weight: 600; }
	.btn.primary:hover { filter: brightness(1.08); }
	.scrim { position: fixed; inset: 0; z-index: 9; display: none; }
	.scrim.show { display: block; }
	.add-form.show ~ .scrim.show { background: rgba(0, 0, 0, 0.25); }
</style>
</head>
<body>
<div class="aura"><i></i><i></i></div>
<div class="shade"></div>
<main>
	<div class="spacer"></div>
	<div class="clock" id="clock">--:--</div>
	<div class="greet" id="greet"></div>
	<label class="search" id="search">
		<span id="search-ic"></span>
		<input id="q" type="text" spellcheck="false" autocomplete="off" placeholder="Search or type a URL">
	</label>
	<div class="tiles" id="tiles"></div>
	<div class="spacer"></div>
</main>
<div class="pop panel" id="pop"></div>
<div class="add-form panel" id="add">
	<h3>Add a shortcut</h3>
	<input class="field" id="add-name" type="text" placeholder="Name" spellcheck="false">
	<input class="field" id="add-url" type="text" placeholder="Address, like youtube.com" spellcheck="false">
	<div class="row"><button class="btn" id="add-cancel">Cancel</button><button class="btn primary" id="add-ok">Add</button></div>
</div>
<div class="scrim" id="scrim"></div>

<script src="icons.js"></script>
<script>
'use strict';
const wv = window.chrome && window.chrome.webview;
const send = (t, o) => { if (wv) wv.postMessage(Object.assign({ t }, o || {})); };
const $ = id => document.getElementById(id);
let tiles = [];

$('search-ic').innerHTML = icon('search', 18);

function tick() {
	const d = new Date();
	$('clock').textContent = d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
	const h = d.getHours();
	const part = h < 5 ? 'Up late' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
	$('greet').innerHTML = '<b>' + part + '</b> · ' + esc(d.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' }));
}
tick();
setInterval(tick, 1000);

function setAccent(hex) {
	const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
	if (!m) return;
	const n = parseInt(m[1], 16);
	document.documentElement.style.setProperty('--accent', '#' + m[1]);
	document.documentElement.style.setProperty('--accent-rgb', (n >> 16) + ', ' + ((n >> 8) & 255) + ', ' + (n & 255));
}

function onHost(m) {
	if (m.t !== 'ntp') return;
	setAccent(m.accent);
	$('q').placeholder = 'Search ' + m.engine + ' or type a URL';
	tiles = m.tiles || [];
	renderTiles();
}
if (wv) wv.addEventListener('message', e => onHost(e.data));

// The box hands what you type to the address bar, so you get its suggestions.
const q = $('q');
q.addEventListener('input', () => {
	const text = q.value;
	q.value = '';
	if (wv) send('focusOmnibox', { text });
	else q.value = text;
});
q.addEventListener('keydown', e => {
	if (e.key === 'Enter' && q.value.trim()) send('search', { q: q.value });
});
q.addEventListener('mousedown', e => {
	if (!wv) return;
	e.preventDefault();
	send('focusOmnibox', { text: '' });
});

function renderTiles() {
	const box = $('tiles');
	const shown = tiles.slice(0, 10);
	box.innerHTML = shown.map((t, i) => {
		const host = bareHost(t.url);
		const title = t.title && t.title.length < 40 ? t.title : (host.split('.').slice(-2, -1)[0] || host);
		const name = title.length > 22 ? host : title;
		const hue = hostHue(host);
		const ic = t.icon
			? '<img src="' + t.icon + '" alt="">'
			: '';
		const bg = t.icon ? '' : ' style="background:linear-gradient(160deg,hsl(' + hue + ',55%,52%),hsl(' + ((hue + 30) % 360) + ',55%,34%))"';
		return '<a class="tile" href="' + esc(t.url) + '" data-i="' + i + '" title="' + esc(t.title || host) + '">' +
			(t.pinned ? '<span class="pinmark">' + icon('pin', 12) + '</span>' : '') +
			'<span class="ic-wrap"' + bg + '>' + (ic || esc((name[0] || '?').toUpperCase())) + '</span>' +
			'<span class="name">' + esc(name) + '</span>' +
			'<button class="more" title="More">' + icon('menu', 15) + '</button></a>';
	}).join('') + (shown.length < 10 ? '<a class="tile add" href="#" id="add-tile"><span class="ic-wrap">' + icon('plus', 22) + '</span><span class="name">Add shortcut</span></a>' : '');
	// Tiny favicons look blurry blown up; show them at their own size.
	for (const img of box.querySelectorAll('img')) {
		const fix = () => { if (img.naturalWidth && img.naturalWidth < 28) img.classList.add('small'); };
		if (img.complete) fix(); else img.onload = fix;
	}
}

$('tiles').addEventListener('click', e => {
	const more = e.target.closest('.more');
	const tile = e.target.closest('.tile');
	if (!tile) return;
	if (tile.id === 'add-tile') { e.preventDefault(); openAdd(); return; }
	if (more) {
		e.preventDefault();
		e.stopPropagation();
		openPop(+tile.dataset.i, more.getBoundingClientRect());
	}
});

let popIndex = -1;
function openPop(i, r) {
	popIndex = i;
	const t = tiles[i];
	const pop = $('pop');
	pop.innerHTML =
		'<div class="mi" data-a="pin">' + icon(t.pinned ? 'unpin' : 'pin', 16) + (t.pinned ? 'Unpin' : 'Keep here') + '</div>' +
		'<div class="mi" data-a="tab">' + icon('tab', 16) + 'Open in new tab</div>' +
		'<div class="mi" data-a="hide">' + icon('trash', 16) + 'Remove</div>';
	pop.style.left = Math.min(r.left, window.innerWidth - 200) + 'px';
	pop.style.top = (r.bottom + 6) + 'px';
	pop.classList.add('show');
	$('scrim').classList.add('show');
}
function closePop() {
	$('pop').classList.remove('show');
	$('add').classList.remove('show');
	$('scrim').classList.remove('show');
}
$('scrim').addEventListener('mousedown', closePop);
$('pop').addEventListener('click', e => {
	const a = e.target.closest('[data-a]');
	if (!a || popIndex < 0) return;
	const t = tiles[popIndex];
	if (a.dataset.a === 'pin') send('pin', { url: t.url, title: t.title, on: !t.pinned });
	if (a.dataset.a === 'hide') send('hide', { url: t.url });
	if (a.dataset.a === 'tab') window.open(t.url, '_blank');
	closePop();
});

function openAdd() {
	$('add-name').value = '';
	$('add-url').value = '';
	$('add').classList.add('show');
	$('scrim').classList.add('show');
	setTimeout(() => $('add-url').focus(), 30);
}
$('add-cancel').onclick = closePop;
$('add-ok').onclick = () => {
	const url = $('add-url').value.trim();
	if (!url) { $('add-url').focus(); return; }
	send('addSite', { url, title: $('add-name').value.trim() });
	closePop();
};
for (const id of ['add-name', 'add-url']) $(id).addEventListener('keydown', e => {
	if (e.key === 'Enter') $('add-ok').click();
	if (e.key === 'Escape') closePop();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePop(); });

send('ntpReady');
</script>
</body>
</html>
