<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Signed in</title>
<link rel="stylesheet" href="common.css">
<style>
	/* How Oazy's Google sign-in went, on the window's glass. The window closes
	   itself a moment later (or with Done). */
	html, body { background: transparent; overflow: hidden; }
	main {
		height: 100%;
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		gap: 0;
		padding: 32px;
		text-align: center;
		animation: rise 0.45s var(--ease) both;
	}
	@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
	.avatar {
		position: relative;
		width: 96px;
		height: 96px;
		border-radius: 50%;
		display: grid;
		place-items: center;
		font-size: 38px;
		font-weight: 600;
		color: #fff;
		background: rgba(var(--accent-rgb), 0.3) center / cover no-repeat;
		box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.16), 0 10px 28px rgba(0, 0, 0, 0.22);
	}
	.badge {
		position: absolute;
		right: -2px;
		bottom: -2px;
		width: 30px;
		height: 30px;
		border-radius: 50%;
		display: grid;
		place-items: center;
		color: #06221f;
		background: var(--accent);
		box-shadow: 0 0 0 3px rgba(10, 18, 24, 0.9);
	}
	h1 { margin: 26px 0 6px; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
	.who { font-size: 14px; color: var(--text); }
	.mail { margin-top: 2px; font-size: 13px; color: var(--dim); }
	p { max-width: 320px; margin: 22px 0 26px; font-size: 13px; line-height: 1.5; color: var(--dim); }
	button {
		min-width: 120px;
		height: 36px;
		padding: 0 18px;
		border-radius: 10px;
		font-weight: 600;
		background: rgba(255, 255, 255, 0.1);
		box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
		transition: background 0.15s;
	}
	button:hover { background: rgba(255, 255, 255, 0.16); }
</style>
</head>
<body>
<main>
	<div class="avatar" id="avatar"><span id="letter"></span><i class="badge" id="badge"></i></div>
	<h1 id="title"></h1>
	<div class="who" id="name"></div>
	<div class="mail" id="mail"></div>
	<p id="note"></p>
	<button id="done">Done</button>
</main>
<script src="icons.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
let info = {};
try { info = JSON.parse(decodeURIComponent(location.hash.slice(1))) || {}; } catch (e) { }

const m = /^#?([0-9a-f]{6})$/i.exec(info.accent || '');
if (m) {
	const n = parseInt(m[1], 16);
	document.documentElement.style.setProperty('--accent', '#' + m[1]);
	document.documentElement.style.setProperty('--accent-rgb', (n >> 16) + ', ' + ((n >> 8) & 255) + ', ' + (n & 255));
}

const name = info.name || '';
const mail = info.email || '';
if (info.signedOut) {
	$('title').textContent = 'You’re signed out';
	$('letter').innerHTML = icon('lock', 34);
	$('badge').remove();
	$('note').textContent = 'Oazy Browser, Flow and your other web apps are signed out of Google too.';
} else {
	$('title').textContent = name ? 'Welcome, ' + name.split(' ')[0] : 'You’re signed in';
	$('name').textContent = name;
	$('mail').textContent = mail;
	$('letter').textContent = (name || mail || '?').trim().charAt(0).toUpperCase();
	$('badge').innerHTML = icon('check', 16);
	if (/^https:\/\/[a-z0-9.-]+\.googleusercontent\.com\//i.test(info.photo || '')) {
		const url = info.photo.replace(/=s\d+(-c)?$/, '=s192-c');
		const img = new Image();
		img.onload = () => { $('avatar').style.backgroundImage = 'url("' + url + '")'; $('letter').textContent = ''; };
		img.src = url;
	}
	$('note').textContent = 'You’re signed in across Oazy: Oazy Browser, Flow and your other web apps use this account now.';
}

const wv = window.chrome && window.chrome.webview;
const close = () => { if (wv) wv.postMessage({ t: 'signinDone' }); };
$('done').onclick = close;
setTimeout(close, info.test ? 600000 : 4200);
</script>
</body>
</html>
